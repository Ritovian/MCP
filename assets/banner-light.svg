<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title description">
  <title id="title">Ritovian MCP</title>
  <desc id="description">An editorial ivory and copper banner with an open book framed by concentric arches. Many traditions. Deeper understanding. Religious knowledge, connected to your AI assistant.</desc>
  <defs>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    </style>
    <pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="#946344" opacity="0.08"/>
      <circle cx="5" cy="5" r="0.5" fill="#946344" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="480" rx="4" fill="#F4EFE6"/>
  <rect width="1280" height="480" rx="4" fill="url(#paper)"/>
  <rect x="20.5" y="20.5" width="1239" height="439" rx="2" fill="none" stroke="#D9CEBC"/>

  <g transform="translate(64 43)" fill="none" stroke="#946344" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M14 4C10 1 5 0 0 1v19c5-1 10 0 14 3Z"/>
<path d="M14 4c3-1 6-1.5 9-1.5M14 23c3-2 6-2.5 9-2.5"/>
<rect x="22" y="0.5" width="4.5" height="21" rx="2.25"/>
<path d="M14 4v19"/>
  </g>
  <text x="110" y="60" class="sans" font-size="15" font-weight="600" letter-spacing="3.5" fill="#203A35">RITOVIAN / MCP</text>
  <text x="1216" y="59" text-anchor="end" class="mono" font-size="12" letter-spacing="1.3" fill="#746451">KNOWLEDGE WITH CONTEXT</text>
  <path d="M64 85.5H1216" stroke="#D9CEBC"/>

  <text x="64" y="208" class="serif" font-size="112" letter-spacing="-5" fill="#203A35">Ritovian<tspan fill="#946344">.</tspan></text>
  <text x="69" y="268" class="serif" font-size="35" letter-spacing="-0.5" fill="#203A35">Many traditions. Deeper understanding.</text>
  <text x="70" y="314" class="sans" font-size="21" fill="#675F53">Religious knowledge, connected to your AI assistant.</text>

  <g transform="translate(1002 242)">
    <circle r="147" fill="#EBE3D5"/>
    <circle r="163" fill="none" stroke="#C8B79E" stroke-width="1"/>
    <circle r="151" fill="none" stroke="#C8B79E" stroke-width="0.75"/>
    <path d="M-123 90V-25a123 123 0 0 1 246 0V90" fill="none" stroke="#946344" stroke-width="1.25"/>
    <path d="M-108 90V-25a108 108 0 0 1 216 0V90" fill="none" stroke="#B49774" stroke-width="0.75"/>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- the bound page, with the pages beneath it -->
      <path d="M0 7C-28-12-62-17-92-10v91c31-7 63-2 92 17Z" fill="#F4EFE6" stroke="#946344" stroke-width="2"/>
      <path d="M-84 87c27-5 56-2 84 14" stroke="#B49774" stroke-width="1.25"/>
      <path d="M-73 12c19-2 37 2 55 11M-73 27c19-2 37 2 55 11M-73 42c19-2 37 2 55 11M-73 57c19-2 37 2 55 11" stroke="#B49774" stroke-width="1.25"/>
      <!-- the sheet runs on and winds onto the scroll roller -->
      <path d="M0 7C21 0 40-3 60-3V88C40 88 21 91 0 98Z" fill="#F4EFE6" stroke="#946344" stroke-width="2"/>
      <path d="M0 7v96" stroke="#946344" stroke-width="1.75"/>
      <path d="M16 18h28M16 33h28M16 48h28M16 63h28" stroke="#B49774" stroke-width="1.25"/>
      <rect x="57" y="-9" width="26" height="110" rx="13" fill="#F4EFE6" stroke="#946344" stroke-width="1.75"/>
      <path d="M70-26v17M70 101v17" stroke="#946344" stroke-width="1.5"/>
      <circle cx="70" cy="-31" r="5" stroke="#946344" stroke-width="1.25"/>
      <circle cx="70" cy="123" r="5" stroke="#946344" stroke-width="1.25"/>
      <path d="m0-94 12 12-12 12-12-12Z" stroke="#946344" stroke-width="1"/>
      <circle cy="-82" r="22" stroke="#B49774" stroke-width="0.75"/>
      <path d="M-35-39 0-57l35 18" stroke="#B49774" stroke-width="0.75"/>
    </g>

    <g fill="#946344">
      <circle cx="-163" r="3"/>
      <circle cx="163" r="3"/>
    </g>
  </g>

  <path d="M64 399.5H1216" stroke="#D9CEBC"/>
  <text x="65" y="432" class="sans" font-size="12" font-weight="500" letter-spacing="2.1" fill="#746451">BELIEFS</text>
  <circle cx="157" cy="428" r="1.5" fill="#946344"/>
  <text x="179" y="432" class="sans" font-size="12" font-weight="500" letter-spacing="2.1" fill="#746451">PRACTICES</text>
  <circle cx="295" cy="428" r="1.5" fill="#946344"/>
  <text x="317" y="432" class="sans" font-size="12" font-weight="500" letter-spacing="2.1" fill="#746451">TRADITIONS</text>
  <text x="1216" y="432" text-anchor="end" class="mono" font-size="11" letter-spacing="1.3" fill="#746451">MODEL CONTEXT PROTOCOL</text>
</svg>
